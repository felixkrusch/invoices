# Production stack for invoices
# Minimal: app + worker + db
# Optional updater: set UPDATER_TOKEN and use profile "updater"

services:
  app:
    image: ${APP_IMAGE:-invoices:latest}
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/invoices
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_IMAGE=${APP_IMAGE:-invoices:latest}
      - COMPOSE_FILE=/app/invoices/compose.yaml
      - UPDATE_SERVICE=app
      - LICENSE_MODE=${LICENSE_MODE:-open}
      - JOB_RUNNER_URL=http://app:3000
      # Only set UPDATER_URL when running with --profile updater
      - UPDATER_URL=${UPDATER_URL:-}
      - UPDATER_TOKEN=${UPDATER_TOKEN:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app_data:/app/invoices/.data
      - ./backups:/app/invoices/backups
      - ./logs:/app/invoices/logs
      - ./uploads:/app/invoices/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ${APP_IMAGE:-invoices:latest}
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/invoices
      - JOB_RUNNER_URL=http://app:3000
      - LICENSE_MODE=${LICENSE_MODE:-open}
    volumes:
      - app_data:/app/invoices/.data
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=invoices
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: docker compose --profile updater up -d
  updater:
    profiles: ["updater"]
    build:
      context: .
      dockerfile: ./updater/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - UPDATER_PORT=4000
      - UPDATER_TOKEN=${UPDATER_TOKEN:?UPDATER_TOKEN is required when using updater profile}
      - COSIGN_IDENTITY=${COSIGN_IDENTITY:-}
      - COSIGN_OIDC_ISSUER=${COSIGN_OIDC_ISSUER:-https://token.actions.githubusercontent.com}
      - COSIGN_PUBLIC_KEY=${COSIGN_PUBLIC_KEY:-}
      - UPDATE_VERIFY_SIGNATURE=${UPDATE_VERIFY_SIGNATURE:-true}
      - APP_IMAGE=${APP_IMAGE:-invoices:latest}
      - UPDATE_SERVICE=app
      - COMPOSE_FILE=/app/invoices/compose.yaml
      - APP_PUBLIC_URL=http://app:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./compose.yaml:/app/invoices/compose.yaml:ro
      - ./backups:/app/invoices/backups

volumes:
  postgres_data:
  app_data:
