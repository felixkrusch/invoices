name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write   # required for cosign keyless (OIDC -> Fulcio)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}   # e.g. owner/entrytwo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          # Expose the pushed image digest (index digest) for signing + manifest.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Sign image (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - name: cosign sign
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
        env:
          COSIGN_YES: "true"

      - name: Generate SBOM + SLSA provenance
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          output-file: sbom.spdx.json
      - name: Attest SBOM
        uses: actions/attest@v1
        with:
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom.spdx.json
      - name: Attest SLSA provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build signed release manifest
        id: manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          MIN_VERSION: ${{ vars.MIN_SUPPORTED_VERSION || '0.1.0' }}
          CHANNEL: ${{ vars.RELEASE_CHANNEL || 'stable' }}
          CHANGELOG: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          cat > manifest.json <<EOF
          {
            "version": "${VERSION}",
            "image": "${IMAGE}",
            "digest": "${DIGEST}",
            "minSupportedVersion": "${MIN_VERSION}",
            "channel": "${CHANNEL}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "changelogUrl": "${CHANGELOG}"
          }
          EOF
          cosign sign-blob --yes --output-signature manifest.json.sig manifest.json
          echo "manifest=$(cat manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with manifest
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manifest.json
            manifest.json.sig
          body: |
            ## entrytwo ${{ steps.version.outputs.version }}

            Signed image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}`

            Set `UPDATE_MANIFEST_URL` on your instance to the raw `manifest.json` below
            (or pin `APP_IMAGE` to the digest) to receive this update.

            **Verification policy**
            - Keyless (default): identity `https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref_name }}`, issuer `https://token.actions.githubusercontent.com`
            - Or verify with the released `manifest.json.sig` (cosign verify-blob) using our public key.

            ${{ steps.manifest.outputs.manifest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
